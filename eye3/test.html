<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scary Cybernetic Eye with Blink</title>
    <style>
        /* Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background-color: #0a0a0a;
  overflow: hidden;
}

/* Eye Container */
.eye-container {
  width: 250px;
  height: 250px;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle, #2a2a2a, #0a0a0a);
  border-radius: 50%;
  box-shadow: 0px 0px 100px rgba(255, 0, 0, 0.6);
}

/* Outer Ring */
.outer-ring {
  width: 220px;
  height: 220px;
  position: absolute;
  border: 2px solid #ff0000;
  border-radius: 50%;
  box-shadow: 0px 0px 30px rgba(255, 0, 0, 0.8);
  animation: rotateRing 12s linear infinite;
}

/* Sclera */
.sclera {
  width: 200px;
  height: 200px;
  background: radial-gradient(circle at 50% 50%, #4a4a4a, #1a1a1a 95%);
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  position: relative;
}

/* Vein Texture */
.vein-texture {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(
    circle,
    transparent,
    rgba(255, 0, 0, 0.3) 30%,
    transparent 60%
  );
  background-blend-mode: multiply;
  border-radius: 50%;
  z-index: 1;
  opacity: 0.5;
}

/* Cyber Iris */
.cyber-iris {
  width: 120px;
  height: 120px;
  background: radial-gradient(circle at 50% 50%, #330000, #1a0000);
  border-radius: 50%;
  box-shadow: inset 0px 0px 30px rgba(255, 0, 0, 0.7),
    0px 0px 20px rgba(255, 0, 0, 0.5);
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  overflow: hidden;
  animation: pulse 3s infinite;
}

/* Detailed Inner Rings */

/* Inner Ring 1 */
.inner-ring-1 {
  width: 90%;
  height: 90%;
  border-radius: 50%;
  position: absolute;
  background: radial-gradient(circle, #662222, transparent 60%);
  opacity: 0.8;
  animation: rotateInnerRing 8s linear infinite;
}

/* Inner Ring 2 */
.inner-ring-2 {
  width: 70%;
  height: 70%;
  border-radius: 50%;
  position: absolute;
  background: repeating-conic-gradient(
    from 0deg,
    rgba(255, 0, 0, 0.2) 0% 10%,
    transparent 10% 20%
  );
  opacity: 0.6;
  animation: rotateInnerRingReverse 10s linear infinite;
}

/* Inner Ring 3 */
.inner-ring-3 {
  width: 50%;
  height: 50%;
  border-radius: 50%;
  position: absolute;
  background: radial-gradient(circle, #990000, transparent 70%);
  box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
  opacity: 0.7;
  animation: rotateInnerRing 12s linear infinite;
}

/* Inner Circuitry */
.inner-circuitry {
  width: 140%;
  height: 140%;
  position: absolute;
  border-radius: 50%;
  background: repeating-conic-gradient(
    rgba(255, 0, 0, 0.15) 0% 10%,
    rgba(0, 0, 0, 0.2) 10% 20%
  );
  opacity: 0.8;
  animation: rotateCircuitry 15s linear infinite;
}

/* Pupil */
.pupil {
  width: 30px;
  height: 30px;
  background-color: #000;
  border-radius: 50%;
  box-shadow: 0px 0px 20px rgba(255, 0, 0, 0.8);
  z-index: 2;
}

/* Tech Overlay */
.tech-overlay {
  width: 120px;
  height: 120px;
  position: absolute;
  border-radius: 50%;
  background: repeating-radial-gradient(
    circle at 50% 50%,
    rgba(255, 0, 0, 0.1),
    transparent 5%
  );
  box-shadow: inset 0 0 5px rgba(255, 0, 0, 0.7), 0 0 20px rgba(255, 0, 0, 0.4);
  opacity: 0.4;
  z-index: 3;
}

/* Reflection Layer */
.reflection-layer {
  width: 70px;
  height: 70px;
  position: absolute;
  background: radial-gradient(
    circle at 30% 30%,
    rgba(255, 255, 255, 0.4),
    transparent 70%
  );
  border-radius: 50%;
  top: 8px;
  left: 8px;
  z-index: 4;
  opacity: 0.6;
}

/* Eyelids */
.upper-eyelid,
.lower-eyelid {
  position: absolute;
  width: 80%;
  height: 30%;
  background: linear-gradient(to bottom, #0a0a0a, transparent);
  border-radius: 80%;
  left: 25px;
  opacity: 0.35;
  pointer-events: none; /* Make the eyelids non-interactive */
  transform: translateY(0); /* Start position */
  transition: width 1.5s, height 1.5s, opacity 1.5s; /* Transition properties */
}

/* Upper Eyelid */
.upper-eyelid {
  top: 0;
  transform-origin: bottom;
  left: 50%;
  transform: translateX(-50%);
}

/* Lower Eyelid */
.lower-eyelid {
  bottom: 0;
  transform-origin: top;
  background: linear-gradient(to top, #0a0a0a, transparent);
  left: 50%;
  transform: translateX(-50%);
}

/* Blink Animation */
@keyframes blink-upper {
  0%,
  100% {
    transform: translateY(0); /* Start and end at the original position */
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    height: 30%;
    opacity: 0.35;
  }
  50% {
    transform: translateY(100px); /* Move down to cover the eye */
    left: 50%;
    transform: translateX(-50%);
    width: 100%; /* Make it slightly wider */
    height: 70%; /* Make it slightly taller */
    opacity: 1; /* Increase opacity */
  }
}

@keyframes blink-lower {
  0%,
  100% {
    transform: translateY(0); /* Start and end at the original position */
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    height: 30%;
    opacity: 0.35;
  }
  50% {
    transform: translateY(-100px); /* Move up to cover the eye */
    left: 50%;
    transform: translateX(-50%);
    width: 100%; /* Make it slightly wider */
    height: 70%; /* Make it slightly taller */
    opacity: 1; /* Increase opacity */
  }
}

/* Animation classes applied on click */
.upper-eyelid.blinking {
  animation: blink-upper 1.5s forwards;
}

.lower-eyelid.blinking {
  animation: blink-lower 1.5s forwards;
}

/* Animations */
@keyframes rotateRing {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

@keyframes rotateInnerRing {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

@keyframes rotateInnerRingReverse {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(-360deg);
  }
}

@keyframes rotateCircuitry {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(-360deg);
  }
}

@keyframes pulse {
  0%,
  100% {
    box-shadow: inset 0px 0px 30px rgba(255, 0, 0, 0.7),
      0px 0px 20px rgba(255, 0, 0, 0.5);
  }
  50% {
    box-shadow: inset 0px 0px 50px rgba(255, 0, 0, 1),
      0px 0px 40px rgba(255, 0, 0, 0.9);
  }
}
    </style>
</head>
<body>
    <div class="eye-container">
        <div class="eye-socket">
            <div class="outer-ring"></div>
            <div class="sclera">
                <div class="vein-texture"></div>
                <div class="cyber-iris">
                    <div class="inner-ring-1"></div>
                    <div class="inner-ring-2"></div>
                    <div class="inner-ring-3"></div>
                    <div class="inner-circuitry"></div>
                    <div class="pupil"></div>
                    <div class="tech-overlay"></div>
                    <div class="reflection-layer"></div>
                </div>
            </div>
            <div class="upper-eyelid"></div>
            <div class="lower-eyelid"></div>
        </div>
    </div>
    <script>// script.js

        // Select the iris and eyelid elements
        const iris = document.querySelector('.cyber-iris');
        const upperEyelid = document.querySelector('.upper-eyelid');
        const lowerEyelid = document.querySelector('.lower-eyelid');
        
        // Function to move the iris towards the cursor
        function moveEye(event) {
            const eyeRect = iris.parentNode.getBoundingClientRect();
            const eyeCenterX = eyeRect.left + eyeRect.width / 2;
            const eyeCenterY = eyeRect.top + eyeRect.height / 2;
        
            const angle = Math.atan2(event.clientY - eyeCenterY, event.clientX - eyeCenterX);
        
            // Constrain the iris movement within a limited range
            const irisMoveDistance = 15;
            const irisX = irisMoveDistance * Math.cos(angle);
            const irisY = irisMoveDistance * Math.sin(angle);
        
            iris.style.transform = `translate(${irisX}px, ${irisY}px)`;
        }
        
        // Function to trigger the blink animation
        function blinkEye() {
            // Add the "blinking" class to trigger animation
            upperEyelid.classList.add('blinking');
            lowerEyelid.classList.add('blinking');
        
            // Remove the class after the animation ends
            setTimeout(() => {
                upperEyelid.classList.remove('blinking');
                lowerEyelid.classList.remove('blinking');
            }, 1500); // Match the animation duration
        }
        
        // Add mousemove event listener to track cursor
        document.addEventListener('mousemove', moveEye);
        
        // Add click event listener to trigger the blink
        document.addEventListener('click', blinkEye);
        </script>
</body>
</html>
