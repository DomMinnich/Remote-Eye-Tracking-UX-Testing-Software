<!-- login.html -->
{% extends 'base.html' %} {% block content %}

<!-- Centered Container -->
<div class="login-page">
  <h2 class="login-title">Login</h2>

  <!-- Animated Eye Container -->
  <div class="eye-container">
    <div class="eye-socket">
      <div class="outer-ring"></div>
      <div class="sclera">
        <div class="vein-texture"></div>
        <div class="cyber-iris">
          <div class="inner-ring-1"></div>
          <div class="inner-ring-2"></div>
          <div class="inner-ring-3"></div>
          <div class="inner-circuitry"></div>
          <div class="pupil"></div>
          <div class="tech-overlay"></div>
          <div class="reflection-layer"></div>
        </div>
      </div>
      <div class="upper-eyelid"></div>
      <div class="lower-eyelid"></div>
    </div>
  </div>

  <!-- Form Section -->
  <form method="POST" class="login-form">
    {{ form.hidden_tag() }}
    <div class="form-group">
      <label for="username">{{ form.username.label }}</label>
      {{ form.username(id="username") }}
    </div>
    <div class="form-group">
      <label for="password">{{ form.password.label }}</label>
      {{ form.password(id="password") }}
    </div>
    <div class="form-group">
      {{ form.submit(class="btn-submit") }}
    </div>
    <p class="register-link">
      Don't have an account? <a href="{{ url_for('main.register') }}">Register</a>
    </p>
  </form>
</div>

{% endblock %}
