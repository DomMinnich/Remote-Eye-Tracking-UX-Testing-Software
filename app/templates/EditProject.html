{% extends 'base.html' %} {% block content %}

<style>
  .edit-project-page {
    max-width: 600px;
    margin: 80px auto 100px auto;
    padding: 20px;
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    color: #fff;
  }

  .edit-project-page h2 {
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
    margin-bottom: 20px;
    text-align: center;
  }

  .edit-project-form {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  label {
    font-weight: 600;
    margin-bottom: 5px;
    color: #ffd700;
  }

  input[type="text"],
  textarea {
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    width: 100%;
    box-sizing: border-box;
    color: #000;
  }

  .btn {
    cursor: pointer;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    transition: background-color 0.3s;
    margin: 5px;
    color: #fff;
  }
  .delete-button {
    background-color: #ff0000;
  }
  .delete-button:hover {
    background-color: #cc0000;
  }
  .save-button {
    background-color: #fffb00;
    color: #000;
  }
  .save-button:hover {
    background-color: #dcdc00;
  }
  .button {
    background-color: #007bff;
  }
  .button:hover {
    background-color: #0056b3;
  }
</style>

<div class="edit-project-page">
  <h2>Edit Project</h2>

  <img
    src="https://via.placeholder.com/400"
    alt="Project {{ project.id }}"
    class="project-img"
  />
  <button class="btn button">Change Pic</button>

  <form
    class="edit-project-form"
    method="POST"
    action="{{ url_for('main.editProject', project_id=project.id) }}"
  >
    <div>
      <label for="link">Figma Link:</label>
      <input
        type="text"
        name="link"
        id="link"
        value="{{ project.link }}"
        required
      />
    </div>

    <div>
      <label for="tasks">Tasks (JSON array):</label>
      <textarea name="tasks" id="tasks" rows="3">
{{ project.tasks|tojson }}</textarea
      >
      <small style="color: #aaa"
        >Enter a JSON array, e.g. ["Task1","Task2"]</small
      >
    </div>

    <div>
      <label for="collaborators">Collaborators (JSON array):</label>
      <textarea name="collaborators" id="collaborators" rows="3">
{{ project.collaborators|tojson }}</textarea
      >
      <small style="color: #aaa"
        >Format:
        [{"email":"user@example.com","id":"...","role":"editor"},...]</small
      >
    </div>

    <div style="text-align: center; margin-top: 10px">
      <form
        action="{{ url_for('main.delete_project', project_id=project.id) }}"
        method="POST"
        style="display: inline"
      ></form>
      <button class="btn save-button" type="submit">Save</button>
    </div>
    <form
      action="{{ url_for('main.delete_project', project_id=project.id) }}"
      method="POST"
      style="display: inline"
    >
      <button class="btn delete-button" type="submit">Delete</button>
    </form>
  </form>
</div>

{% endblock %}
