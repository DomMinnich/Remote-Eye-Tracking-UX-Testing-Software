<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Database</title>
</head>
<body>
    <h1>Upload Database Files</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul>
                {% for category, message in messages %}
                    <li class="{{ category }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}
    <form method="POST" enctype="multipart/form-data">
        <label for="site_db">Site Database (site.db):</label>
        <input type="file" name="site_db" id="site_db" required>
        <br>
        <label for="app_db">App Database (app.db):</label>
        <input type="file" name="app_db" id="app_db" required>
        <br>
        <button type="submit">Upload</button>
    </form>
</body>
</html>
