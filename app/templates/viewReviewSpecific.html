{% extends 'base.html' %} {% block content %}
<title>Review Player</title>

<style>
  .video-player-page {
    max-width: 900px;
    margin: 80px auto 100px auto;
    padding: 20px;
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  }

  .video-player-page h2 {
    font-size: 2rem;
    text-align: center;
    color: #fff;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
    margin-bottom: 24px;
  }

  .vrs-back-button {
    display: inline-block;
    text-decoration: none;
    color: #fff;
    background-color: #616161;
    padding: 8px 14px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-weight: 600;
    transition: background-color 0.3s;
  }
  .vrs-back-button:hover {
    background-color: #444;
  }

  .vrs-review_id {
    color: #ffd700;
    font-weight: 600;
    margin-top: 0;
    margin-bottom: 16px;
  }
  .vrs-review_date {
    color: #ccc;
    margin: 0 0 16px;
  }

  .vrs-video-container {
    position: relative;
    width: 100%;
    margin-bottom: 20px;
  }

  video {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 12px;
    border: 2px solid #ccc;
    background-color: #000;
  }

  .vrs-tooltip-icon {
    position: absolute;
    top: 10px;
    right: 10px;
    cursor: pointer;
    font-size: 1.5rem;
    color: #fff;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
  }
  .vrs-tooltip-icon:hover {
    color: #ffd700;
  }

  .vrs-tooltip-overlay {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .vrs-tooltip-item {
    position: absolute;
    background-color: rgba(0, 0, 0, 0.7);
    color: #fff;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.9rem;
    text-align: center;
    pointer-events: none;
  }
  .vrs-tooltip-item p {
    margin: 0;
  }
  .vrs-arrow {
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 6px solid rgba(0, 0, 0, 0.7);
    margin: 4px auto 0 auto;
  }

  .vrs-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    background-color: rgba(255, 255, 255, 0.1);
    border-radius: 6px;
    padding: 10px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .vrs-box {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .vrs-sparkle {
    cursor: pointer;
    background-color: #4169e1;
    color: #fff;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    transition: background-color 0.3s;
  }
  .vrs-sparkle:hover {
    background-color: #27408b;
  }

  .vrs-sparkle:active {
    transform: scale(0.95);
  }

  .vrs-seek-bar,
  .vrs-volume-bar {
    flex: 1 1 auto;
    -webkit-appearance: none;
    appearance: none;
    background: #ccc;
    height: 6px;
    border-radius: 3px;
    cursor: pointer;
  }

  .vrs-seek-bar::-webkit-slider-thumb,
  .vrs-volume-bar::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    background: #4169e1;
    border-radius: 50%;
    border: 1px solid #fff;
    cursor: pointer;
  }

  #vrs-speed-control {
    padding: 6px;
    border-radius: 6px;
    border: 1px solid #ccc;
    outline: none;
    font-weight: 600;
    background-color: #fff;
    color: #000; /* Ensuring text is black */
  }
  #vrs-speed-control:focus {
    border-color: #00c1ff;
  }

  .vrs-time-display {
    font-weight: 600;
    color: #fff;
    min-width: 100px;
    text-align: center;
    margin-right: 6px;
  }

  .vrs-lens {
    display: none;
    position: absolute;
    pointer-events: none;
    border: 2px solid #fff;
    border-radius: 50%;
    width: 200px;
    height: 200px;
    z-index: 10;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
  }

  @media (max-width: 600px) {
    .video-player-page {
      margin: 60px 10px 100px 10px;
      padding: 15px;
    }
    .video-player-page h2 {
      font-size: 1.6rem;
    }
    .vrs-controls {
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    .vrs-time-display {
      margin-left: 0;
    }
    .vrs-seek-bar,
    .vrs-volume-bar {
      width: 100%;
    }
  }

  .task-comparison-sidebar {
    position: fixed;
    top: 100px;
    left: 20px;
    width: 250px;
    background-color: rgba(0, 0, 0, 0.8);
    color: white;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    z-index: 1000;
  }
  .task-comparison-sidebar h3 {
    text-align: center;
    margin-bottom: 10px;
    color: #ffffff;
  }
  .task-comparison-sidebar .task {
    margin-bottom: 12px;
    padding: 8px;
    background-color: rgba(255, 255, 255, 0.1);
    border-radius: 4px;
  }
  .task-comparison-sidebar .task span {
    display: block;
    margin-bottom: 3px;
  }
  .task-comparison-sidebar .task-name {
    font-weight: bold;
    color: #ffd700;
  }
  .task-comparison-sidebar .benchmark-time {
    color: #ffffff;
  }
  .task-comparison-sidebar .review-time {
    color: #cccccc;
  }
  .task-comparison-sidebar .positive {
    color: #4ecdc4; /* Green color for positive/faster times */
  }
  .task-comparison-sidebar .negative {
    color: #ff6b6b; /* Red color for negative/slower times */
  }
  
  /* Label colors */
  label {
    color: #ffffff;
  }
</style>

<div class="video-player-page">
  <h2>Review Player</h2>

  <a href="javascript:history.back()" class="vrs-back-button">
    Back to Submissions
  </a>

  <p class="vrs-review_id">Project Submission</p>
  <!--
  <p class="vrs-review_date">Date: ...</p>
  <p class="vrs-review_title">Title ...</p>
  <p class="vrs-review_tasks">Tasks ...</p>
  -->

  <div class="vrs-video-container">
    <video
      id="vrs-video"
      src="{{ url_for('static', filename=video_url) }}"
      poster="static/Playbutton.png"
      preload="metadata"
    ></video>

    <div class="vrs-tooltip-icon" title="Show Controls Guide">❔</div>

    <div class="vrs-tooltip-overlay">
      <div class="vrs-tooltip-item" style="top: 75%; left: 1%">
        <p>Back 5</p>
        <div class="vrs-arrow" style="transform: rotate(180deg)"></div>
      </div>
      <div class="vrs-tooltip-item" style="top: 80%; left: 5.5%">
        <p>Play/Pause</p>
        <div class="vrs-arrow" style="transform: rotate(180deg)"></div>
      </div>
      <div class="vrs-tooltip-item" style="top: 75%; left: 12%">
        <p>Forward 5</p>
        <div class="vrs-arrow" style="transform: rotate(180deg)"></div>
      </div>
      <div class="vrs-tooltip-item" style="top: 82%; left: 30%">
        <p>Time Slider</p>
        <div class="vrs-arrow" style="transform: rotate(180deg)"></div>
      </div>
      <div class="vrs-tooltip-item" style="top: 30%; left: 40%">
        <p><br />Hold Shift For Magnifier<br /></p>
        <div class="vrs-arrow" style="transform: rotate(180deg)"></div>
      </div>
      <div class="vrs-tooltip-item" style="top: 80%; left: 51.5%">
        <p>Mute/Unmute</p>
        <div class="vrs-arrow" style="transform: rotate(180deg)"></div>
      </div>
      <div class="vrs-tooltip-item" style="top: 75%; left: 84%">
        <p>Video Speed</p>
        <div class="vrs-arrow" style="transform: rotate(180deg)"></div>
      </div>
      <div class="vrs-tooltip-item" style="top: 80%; left: 92%">
        <p>Fullscreen</p>
        <div class="vrs-arrow" style="transform: rotate(180deg)"></div>
      </div>
    </div>

    <div class="vrs-controls">
      <div class="vrs-box">
        <button
          id="vrs-backward"
          aria-label="Backward 5 seconds"
          class="vrs-sparkle"
        >
          -5
        </button>
        <button id="vrs-play-pause" aria-label="Play/Pause" class="vrs-sparkle">
          ▶
        </button>
        <button
          id="vrs-forward"
          aria-label="Forward 5 seconds"
          class="vrs-sparkle"
        >
          +5
        </button>
      </div>

      <input type="range" id="vrs-seek-bar" class="vrs-seek-bar" value="0" />
      <span id="vrs-time-display" class="vrs-time-display"> 0:00 / 0:00 </span>

      <button id="vrs-mute" aria-label="Mute/Unmute" class="vrs-sparkle">
        🔈
      </button>
      <input
        type="range"
        id="vrs-volume-bar"
        class="vrs-volume-bar"
        min="0"
        max="1"
        step="0.1"
        value="1"
      />
      <select id="vrs-speed-control" aria-label="Speed Control">
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>
      <button id="vrs-fullscreen" aria-label="Fullscreen" class="vrs-sparkle">
        ⛶
      </button>
    </div>
  </div>

  <div class="vrs-lens" id="vrs-lens"></div>
</div>

<div class="task-comparison-sidebar">
  <h3>Task Comparison</h3>
  <div id="task-comparison-list">
    <!-- Task comparisons will be dynamically inserted here -->
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const tooltipIcon = document.querySelector(".vrs-tooltip-icon");
    const tooltipOverlay = document.querySelector(".vrs-tooltip-overlay");

    tooltipIcon.addEventListener("mouseover", () => {
      tooltipOverlay.style.display = "flex";
    });

    tooltipIcon.addEventListener("mouseout", () => {
      tooltipOverlay.style.display = "none";
    });

    const video = document.getElementById("vrs-video");
    const playPauseBtn = document.getElementById("vrs-play-pause");
    const seekBar = document.getElementById("vrs-seek-bar");
    const timeDisplay = document.getElementById("vrs-time-display");
    const muteBtn = document.getElementById("vrs-mute");
    const volumeBar = document.getElementById("vrs-volume-bar");
    const fullscreenBtn = document.getElementById("vrs-fullscreen");
    const speedControl = document.getElementById("vrs-speed-control");
    const forwardBtn = document.getElementById("vrs-forward");
    const backwardBtn = document.getElementById("vrs-backward");

    playPauseBtn.addEventListener("click", () => {
      if (video.paused || video.ended) {
        video.play();
        playPauseBtn.textContent = "❚❚";
      } else {
        video.pause();
        playPauseBtn.textContent = "▶";
      }
    });

    video.addEventListener("click", () => {
      if (video.paused || video.ended) {
        video.play();
        playPauseBtn.textContent = "❚❚";
      } else {
        video.pause();
        playPauseBtn.textContent = "▶";
      }
    });

    forwardBtn.addEventListener("click", () => {
      video.currentTime = Math.min(video.currentTime + 5, video.duration);
    });

    backwardBtn.addEventListener("click", () => {
      video.currentTime = Math.max(video.currentTime - 5, 0);
    });

    video.addEventListener("timeupdate", () => {
      const progress = (video.currentTime / video.duration) * 100;
      seekBar.value = progress;
      timeDisplay.textContent = `${formatTime(
        video.currentTime
      )} / ${formatTime(video.duration)}`;
    });

    seekBar.addEventListener("input", () => {
      const time = (seekBar.value / 100) * video.duration;
      video.currentTime = time;
    });

    muteBtn.addEventListener("click", () => {
      video.muted = !video.muted;
      muteBtn.textContent = video.muted ? "🔇" : "🔈";
    });

    volumeBar.addEventListener("input", () => {
      video.volume = volumeBar.value;
    });

    fullscreenBtn.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        video.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });

    speedControl.addEventListener("change", () => {
      video.playbackRate = speedControl.value;
    });

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${minutes}:${secs < 10 ? "0" : ""}${secs}`;
    }

    video.addEventListener("loadedmetadata", () => {
      timeDisplay.textContent = `0:00 / ${formatTime(video.duration)}`;
    });

    // Lens functionality
    const lens = document.getElementById("vrs-lens");
    const lensWidth = lens.offsetWidth;
    const lensHeight = lens.offsetHeight;

    let isShiftPressed = false;

    lens.style.display = "none";

    window.addEventListener("keydown", (e) => {
      if (e.key === "Shift") {
        isShiftPressed = true;
        lens.style.display = "block";
        document.body.style.cursor = "none";
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "Shift") {
        isShiftPressed = false;
        lens.style.display = "none";
        document.body.style.cursor = "auto";
      }
    });

    video.addEventListener("mousemove", moveLens);
    video.addEventListener("touchmove", moveLens);

    function moveLens(e) {
      if (!isShiftPressed) return;

      e.preventDefault();
      const pos = getCursorPos(e);
      let x = pos.x - lensWidth / 2;
      let y = pos.y - lensHeight / 2;

      const videoBounds = video.getBoundingClientRect();
      const maxX = videoBounds.width - lensWidth;
      const maxY = videoBounds.height - lensHeight;

      x = Math.max(0, Math.min(x, maxX));
      y = Math.max(0, Math.min(y, maxY));

      lens.style.left = `${x + videoBounds.left}px`;
      lens.style.top = `${y + videoBounds.top}px`;

      captureAndDisplayFrame(pos);
    }

    function captureAndDisplayFrame(pos) {
      if (!isShiftPressed) return;

      const frame = captureVideoFrame(video);
      lens.style.backgroundImage = `url('${frame}')`;
      lens.style.backgroundSize = `${video.videoWidth * 2}px ${
        video.videoHeight * 2
      }px`;

      const scaleFactorX = video.videoWidth / video.clientWidth;
      const scaleFactorY = video.videoHeight / video.clientHeight;
      const backgroundX = (pos.x * scaleFactorX - lensWidth / 2) * 2;
      const backgroundY = (pos.y * scaleFactorY - lensHeight / 2) * 2;

      lens.style.backgroundPosition = `-${backgroundX}px -${backgroundY}px`;
    }

    function getCursorPos(e) {
      const rect = video.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      return { x, y };
    }

    function captureVideoFrame(videoElement) {
      const canvas = document.createElement("canvas");
      canvas.width = videoElement.videoWidth;
      canvas.height = videoElement.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/png");
    }

    // Task comparison functionality
    const benchmarkTimes = {{ benchmark_times|tojson }}; // Benchmark times from the server
    const reviewTimes = {{ review_times|tojson }}; // Review times from the server

    const taskComparisonList = document.getElementById("task-comparison-list");
    
    // Clear any previous content
    taskComparisonList.innerHTML = "";
    
    // Debug
    console.log("Benchmark times:", benchmarkTimes);
    console.log("Review times:", reviewTimes);
    
    if (!benchmarkTimes || !reviewTimes || benchmarkTimes.length === 0 || reviewTimes.length === 0) {
      const noDataElement = document.createElement("p");
      noDataElement.textContent = "No task comparison data available";
      taskComparisonList.appendChild(noDataElement);
    } else {
      // Create a map of tasks to review times for easier lookup
      const reviewTimesMap = {};
      reviewTimes.forEach(item => {
        if (item && item.task && item.time !== undefined) {
          reviewTimesMap[item.task] = item.time;
        }
      });
      
      // For each benchmark task, find its corresponding review time
      benchmarkTimes.forEach(benchmarkTask => {
        if (!benchmarkTask || !benchmarkTask.task) return;
        
        const taskName = benchmarkTask.task;
        const benchmarkTime = benchmarkTask.time || 0;
        const reviewTime = reviewTimesMap[taskName] || 0;
        const timeDifference = reviewTime - benchmarkTime;
        
        const taskElement = document.createElement("div");
        taskElement.classList.add("task");
        
        const taskNameElem = document.createElement("span");
        taskNameElem.classList.add("task-name");
        taskNameElem.textContent = taskName;
        
        const benchmarkTimeElem = document.createElement("span");
        benchmarkTimeElem.classList.add("benchmark-time");
        benchmarkTimeElem.textContent = `Benchmark: ${formatTime(benchmarkTime)}`;
        
        const reviewTimeElem = document.createElement("span");
        reviewTimeElem.classList.add("review-time");
        reviewTimeElem.textContent = `Review: ${formatTime(reviewTime)}`;
        
        const diffElem = document.createElement("span");
        diffElem.textContent = `Difference: ${timeDifference >= 0 ? '+' : ''}${formatTime(timeDifference)}`;
        diffElem.classList.add(timeDifference <= 0 ? "positive" : "negative");
        
        taskElement.appendChild(taskNameElem);
        taskElement.appendChild(benchmarkTimeElem);
        taskElement.appendChild(reviewTimeElem);
        taskElement.appendChild(diffElem);
        
        taskComparisonList.appendChild(taskElement);
      });
      
      // Also show any review tasks that don't have benchmark equivalents
      reviewTimes.forEach(reviewTask => {
        if (!reviewTask || !reviewTask.task) return;
        
        // Skip if we've already processed this task
        const found = benchmarkTimes.some(b => b.task === reviewTask.task);
        if (found) return;
        
        const taskElement = document.createElement("div");
        taskElement.classList.add("task");
        
        const taskNameElem = document.createElement("span");
        taskNameElem.classList.add("task-name");
        taskNameElem.textContent = reviewTask.task + " (No benchmark)";
        
        const reviewTimeElem = document.createElement("span");
        reviewTimeElem.classList.add("review-time");
        reviewTimeElem.textContent = `Review: ${formatTime(reviewTask.time)}`;
        
        taskElement.appendChild(taskNameElem);
        taskElement.appendChild(reviewTimeElem);
        
        taskComparisonList.appendChild(taskElement);
      });
    }
    
    // Format time in seconds to mm:ss
    function formatTime(seconds) {
      if (seconds === undefined || seconds === null) return "00:00";
      
      const isNegative = seconds < 0;
      seconds = Math.abs(seconds);
      
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      
      return `${isNegative ? '-' : ''}${mins}:${secs.toString().padStart(2, '0')}`;
    }
  });
</script>
{% endblock %}
