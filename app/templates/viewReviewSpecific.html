{% extends 'base.html' %} {% block content %}

<title>Review Player</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }


</style>
<a href="javascript:history.back()" class="vrs-back-button"
  >Back to Submissions</a
>
<p class="vrs-review_id">ID:</p>
<p class="vrs-review_date">Date:</p>
<br />
<div class="vrs-video-container">
  <video
    id="vrs-video"
    src="static/video.mp4"
    poster="static/Playbutton.png"
    preload="metadata"
  ></video>

  <div class="vrs-tooltip-icon" title="Show Controls Guide">❔</div>
  <div class="vrs-tooltip-overlay">
    <div class="vrs-tooltip-item" style="top: 75%; left: 1%">
      <p>Back 5</p>
      <div class="vrs-arrow" style="transform: rotate(180deg)"></div>
    </div>
    <div class="vrs-tooltip-item" style="top: 80%; left: 5.5%">
      <p>Play/Pause</p>
      <div class="vrs-arrow" style="transform: rotate(180deg)"></div>
    </div>
    <div class="vrs-tooltip-item" style="top: 75%; left: 12%">
      <p>Foward 5</p>
      <div class="vrs-arrow" style="transform: rotate(180deg)"></div>
    </div>
    <div class="vrs-tooltip-item" style="top: 82%; left: 30%">
      <p>Time Slider</p>
      <div class="vrs-arrow" style="transform: rotate(180deg)"></div>
    </div>
    <div class="vrs-tooltip-item" style="top: 30%; left: 40%">
      <p><br />Hold Shift For Magnifier<br /></p>
      <div class="vrs-arrow" style="transform: rotate(180deg)"></div>
    </div>
    <div class="vrs-tooltip-item" style="top: 80%; left: 51.5%">
      <p>Mute/Unmute</p>
      <div class="vrs-arrow" style="transform: rotate(180deg)"></div>
    </div>
    <div class="vrs-tooltip-item" style="top: 75%; left: 84%">
      <p>Video Speed</p>
      <div class="vrs-arrow" style="transform: rotate(180deg)"></div>
    </div>
    <div class="vrs-tooltip-item" style="top: 80%; left: 92%">
      <p>Fullscreen</p>
      <div class="vrs-arrow" style="transform: rotate(180deg)"></div>
    </div>
  </div>

  <div class="vrs-controls">
    <div class="vrs-box">
      <button
        id="vrs-backward"
        aria-label="Backward 5 seconds"
        class="vrs-sparkle"
      >
        -5
      </button>
      <button id="vrs-play-pause" aria-label="Play/Pause" class="vrs-sparkle">
        ▶
      </button>
      <button
        id="vrs-forward"
        aria-label="Forward 5 seconds"
        class="vrs-sparkle"
      >
        +5
      </button>
    </div>
    <input type="range" id="vrs-seek-bar" class="vrs-seek-bar" value="0" />
    <span id="vrs-time-display" class="vrs-time-display">0:00 / 0:00</span>

    <button id="vrs-mute" aria-label="Mute/Unmute" class="vrs-sparkle">
      🔈
    </button>
    <input
      type="range"
      id="vrs-volume-bar"
      class="vrs-volume-bar"
      min="0"
      max="1"
      step="0.1"
      value="1"
    />
    <select id="vrs-speed-control" aria-label="Speed Control">
      <option value="0.5">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="1.5">1.5x</option>
      <option value="2">2x</option>
    </select>
    <button id="vrs-fullscreen" aria-label="Fullscreen" class="vrs-sparkle">
      ⛶
    </button>
  </div>
</div>
<p class="vrs-review_title">Title</p>
<p class="vrs-review_tasks">Tasks</p>
<div class="vrs-lens" id="vrs-lens"></div>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const tooltipIcon = document.querySelector(".vrs-tooltip-icon");
    const tooltipOverlay = document.querySelector(".vrs-tooltip-overlay");

    tooltipIcon.addEventListener("mouseover", () => {
      tooltipOverlay.style.display = "flex";
    });

    tooltipIcon.addEventListener("mouseout", () => {
      tooltipOverlay.style.display = "none";
    });

    const video = document.getElementById("vrs-video");
    const playPauseBtn = document.getElementById("vrs-play-pause");
    const seekBar = document.getElementById("vrs-seek-bar");
    const timeDisplay = document.getElementById("vrs-time-display");
    const muteBtn = document.getElementById("vrs-mute");
    const volumeBar = document.getElementById("vrs-volume-bar");
    const fullscreenBtn = document.getElementById("vrs-fullscreen");
    const speedControl = document.getElementById("vrs-speed-control");
    const forwardBtn = document.getElementById("vrs-forward");
    const backwardBtn = document.getElementById("vrs-backward");

    // Button functionality
    playPauseBtn.addEventListener("click", () => {
      if (video.paused || video.ended) {
        video.play();
        playPauseBtn.textContent = "❚❚";
      } else {
        video.pause();
        playPauseBtn.textContent = "▶";
      }
    });

    video.addEventListener("click", () => {
      if (video.paused || video.ended) {
        video.play();
        playPauseBtn.textContent = "❚❚";
      } else {
        video.pause();
        playPauseBtn.textContent = "▶";
      }
    });

    forwardBtn.addEventListener("click", () => {
      video.currentTime = Math.min(video.currentTime + 5, video.duration);
    });

    backwardBtn.addEventListener("click", () => {
      video.currentTime = Math.max(video.currentTime - 5, 0);
    });

    video.addEventListener("timeupdate", () => {
      const progress = (video.currentTime / video.duration) * 100;
      seekBar.value = progress;
      timeDisplay.textContent = `${formatTime(
        video.currentTime
      )} / ${formatTime(video.duration)}`;
    });

    seekBar.addEventListener("input", () => {
      const time = (seekBar.value / 100) * video.duration;
      video.currentTime = time;
    });

    muteBtn.addEventListener("click", () => {
      video.muted = !video.muted;
      muteBtn.textContent = video.muted ? "🔇" : "🔈";
    });

    volumeBar.addEventListener("input", () => {
      video.volume = volumeBar.value;
    });

    fullscreenBtn.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        video.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });

    speedControl.addEventListener("change", () => {
      video.playbackRate = speedControl.value;
    });

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${minutes}:${secs < 10 ? "0" : ""}${secs}`;
    }

    video.addEventListener("loadedmetadata", () => {
      timeDisplay.textContent = `0:00 / ${formatTime(video.duration)}`;
    });

    // Lens functionality
    const lens = document.getElementById("vrs-lens");
    const lensWidth = lens.offsetWidth;
    const lensHeight = lens.offsetHeight;

    let isShiftPressed = false;

    lens.style.display = "none";

    window.addEventListener("keydown", (e) => {
      if (e.key === "Shift") {
        isShiftPressed = true;
        lens.style.display = "block";
        document.body.style.cursor = "none";
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "Shift") {
        isShiftPressed = false;
        lens.style.display = "none";
        document.body.style.cursor = "auto";
      }
    });

    video.addEventListener("mousemove", moveLens);
    video.addEventListener("touchmove", moveLens);

    function moveLens(e) {
      if (!isShiftPressed) return;

      e.preventDefault();
      const pos = getCursorPos(e);
      let x = pos.x - lensWidth / 2;
      let y = pos.y - lensHeight / 2;

      const videoBounds = video.getBoundingClientRect();
      const maxX = videoBounds.width - lensWidth;
      const maxY = videoBounds.height - lensHeight;

      x = Math.max(0, Math.min(x, maxX));
      y = Math.max(0, Math.min(y, maxY));

      lens.style.left = `${x + videoBounds.left}px`;
      lens.style.top = `${y + videoBounds.top}px`;

      captureAndDisplayFrame(pos);
    }

    function captureAndDisplayFrame(pos) {
      if (!isShiftPressed) return;

      const frame = captureVideoFrame(video);
      lens.style.backgroundImage = `url('${frame}')`;
      lens.style.backgroundSize = `${video.videoWidth * 2}px ${
        video.videoHeight * 2
      }px`;

      const scaleFactorX = video.videoWidth / video.clientWidth;
      const scaleFactorY = video.videoHeight / video.clientHeight;
      const backgroundX = (pos.x * scaleFactorX - lensWidth / 2) * 2;
      const backgroundY = (pos.y * scaleFactorY - lensHeight / 2) * 2;

      lens.style.backgroundPosition = `-${backgroundX}px -${backgroundY}px`;
    }

    function getCursorPos(e) {
      const rect = video.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      return { x, y };
    }

    function captureVideoFrame(videoElement) {
      const canvas = document.createElement("canvas");
      canvas.width = videoElement.videoWidth;
      canvas.height = videoElement.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/png");
    }
  });
</script>

{% endblock %}
