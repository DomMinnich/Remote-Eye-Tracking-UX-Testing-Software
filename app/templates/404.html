<!-- Dominic 2024 -->
<!-- 404.html -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
      }
      body {
        background: radial-gradient(circle, #0b0b0b, #111, #191919);
        color: #fff;
        font-family: "Montserrat", sans-serif;
        overflow: hidden;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      .container {
        text-align: center;
        position: relative;
        z-index: 10; /* Bring container and its contents to the top */
      }

      .glitch-wrapper {
        position: relative;
        display: inline-block;
        perspective: 800px;
      }

      .glitch {
        font-size: 12rem;
        font-weight: bold;
        color: #00e6e6;
        position: relative;
        text-shadow: 0px 0px 30px rgba(0, 230, 230, 0.7),
          0px 0px 80px rgba(0, 230, 230, 0.5);
        animation: pulse 2.5s ease-in-out infinite,
          colorShift 3s infinite alternate;
      }

      .glitch::before,
      .glitch::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        color: #ff007f;
        overflow: hidden;
        clip: rect(0, 900px, 0, 0);
        text-shadow: 0px 0px 30px rgba(255, 0, 127, 0.6),
          0px 0px 60px rgba(255, 0, 127, 0.3);
      }

      .glitch::before {
        animation: glitchTop 1.3s infinite linear alternate-reverse;
        z-index: 1;
      }

      .glitch::after {
        animation: glitchBottom 1.5s infinite linear alternate-reverse;
        z-index: 2;
      }

      .glitch-line {
        position: absolute;
        width: 100%;
        height: 4px;
        background-color: rgba(255, 0, 255, 0.4);
        animation: glitchLine 0.15s infinite;
        mix-blend-mode: color-dodge;
      }

      .glitch-line-top {
        top: 40%;
      }

      .glitch-line-bottom {
        bottom: 40%;
      }

      @keyframes glitchLine {
        0%,
        100% {
          transform: scaleX(0);
        }
        50% {
          transform: scaleX(1);
        }
      }

      .particle {
        position: absolute;
        width: 8px;
        height: 8px;
        background-color: rgba(0, 230, 230, 0.8);
        border-radius: 50%;
        box-shadow: 0px 0px 10px rgba(0, 230, 230, 0.8);
        animation: particleMove 8s infinite ease-in-out;
      }

      .particle-1 {
        top: 20%;
        left: 30%;
        animation-delay: 0s;
      }
      .particle-2 {
        top: 60%;
        left: 50%;
        animation-delay: 2s;
      }
      .particle-3 {
        top: 80%;
        left: 20%;
        animation-delay: 4s;
      }

      @keyframes particleMove {
        0%,
        100% {
          transform: translateY(-10px);
          opacity: 0.8;
        }
        50% {
          transform: translateY(10px);
          opacity: 0.3;
        }
      }

      body::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        background: url("{{ url_for('static', filename='duck.gif') }}");
        opacity: 0.2;
        animation: noiseMove 3s infinite linear;
        z-index: 1; /* Ensure noise overlay is behind everything */
      }

      @keyframes noiseMove {
        0% {
          transform: translate(0, 0);
        }
        100% {
          transform: translate(10px, 10px);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          text-shadow: 0px 0px 30px rgba(0, 230, 230, 0.7);
        }
        50% {
          text-shadow: 0px 0px 80px rgba(0, 230, 230, 1);
        }
      }

      @keyframes colorShift {
        0% {
          color: #00e6e6;
          text-shadow: 0px 0px 30px rgba(0, 230, 230, 0.7);
        }
        100% {
          color: #ff007f;
          text-shadow: 0px 0px 30px rgba(255, 0, 127, 0.7);
        }
      }

      @keyframes glitchTop {
        0% {
          clip: rect(10px, 9999px, 40px, 0);
          transform: translate(-5px, -5px);
        }
        50% {
          clip: rect(20px, 9999px, 70px, 0);
          transform: translate(5px, -5px);
        }
        100% {
          clip: rect(5px, 9999px, 50px, 0);
          transform: translate(-5px, 5px);
        }
      }

      @keyframes glitchBottom {
        0% {
          clip: rect(85px, 9999px, 90px, 0);
          transform: translate(5px, 5px);
        }
        50% {
          clip: rect(55px, 9999px, 70px, 0);
          transform: translate(-5px, 5px);
        }
        100% {
          clip: rect(25px, 9999px, 65px, 0);
          transform: translate(5px, -5px);
        }
      }

      .message {
        font-size: 1.8rem;
        margin-top: 1rem;
        color: #bbb;
        animation: fadeIn 2s ease-in;
        font-weight: bold;
        margin-bottom: 2rem;
        z-index: 10; /* Ensure text is above overlays */
      }

      @keyframes fadeIn {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      /* Fully opaque link with a hover effect */
      .home-link {
        font-size: 1.2rem;
        color: #fff;
        border-radius: 5px;
        font-weight: bold;
        padding: 10px 24px;
        background: rgb(236, 75, 99);
        text-decoration: none;
        display: inline-block;
        transition: background 0.3s, transform 0.3s;
        z-index: 10; /* Bring link to the top */
        position: relative; /* Ensure z-index applies */
      }

      .home-link:hover {
        background: rgb(255, 0, 90);
        transform: scale(1.1);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="glitch-wrapper">
        <h1 class="glitch" data-text="404">404</h1>
        <div class="glitch-line glitch-line-top"></div>
        <div class="glitch-line glitch-line-bottom"></div>
        <div class="particle particle-1"></div>
        <div class="particle particle-2"></div>
        <div class="particle particle-3"></div>
      </div>
      <p class="message">Oops! It seems you have waddled too far!</p>
      <p>
        <a class="home-link" href="{{ url_for('main.home') }}"
          >Go to Home Page</a
        >
      </p>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const glitchElement = document.querySelector(".glitch");

        function randomGlitch() {
          glitchElement.classList.toggle("flicker-effect");
          setTimeout(() => {
            glitchElement.classList.remove("flicker-effect");
          }, Math.random() * 300);
        }

        setInterval(randomGlitch, Math.random() * 2000 + 500);
      });
    </script>
  </body>
</html>
