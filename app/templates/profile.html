<!-- profile.html -->

{% extends 'base.html' %}

{% block content %}
<div class="profile-page">
  <h2 class="profile-title">Profile</h2>
  <div class="profile-details">
    <form method="POST" action="{{ url_for('main.upload_profile_picture') }}" enctype="multipart/form-data">
      <div class="profile-picture">
        <img src="{{ url_for('static', filename='uploads/userProfiles/' + (user.picture if user.picture else 'default.jpg')) }}" alt="Profile Picture" class="profile-img">
        <input type="file" name="profile_picture" accept="image/jpeg" class="upload-input">
        <button type="submit" class="btn btn-primary">Upload Picture</button>
      </div>
    </form>
    <p><strong>Username:</strong> {{ user.username }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
    <p><strong>First Name:</strong> {{ user.first_name }}</p>
    <p><strong>Last Name:</strong> {{ user.last_name }}</p>
    <p><strong>Role:</strong> {{ user.role }}</p>
    <p><strong>Date joined:</strong> {{ user.date_created }}</p>
  </div>
</div>
{% endblock %}
